### CPT v2：十一本书（卖报四本全量 + 辅料降权 + 外部四本抽样），语料已净化
### 语料：12949 段 / 1942万字 / 58.3MB | 卖报占 68% | HI 污染 0 行
### 相比 v1 的变化：新增卖报两本都市作（原来我是妖二代/我的姐姐是大明星）、
###   玩家凶猛与恐怖屋降权 0.5（单主角 70/74% 会削弱群像）、外部四本抽样 0.25、
###   并按行剔除 2100+ 行作者话/平台残留（ps：/求票/均订/分隔线/盗版站网址）
### 决策依据：保留 7B（不下探小模型），做最治本的 CPT
### 文献依据：「学习新的风格或体裁」只有 CPT 打勾；CPT 适用于故事生成/语言风格；
###          SFT 明确「不适用小说创作」。CPT 之后必须补 SFT（否则伤指令跟随）
### 数据：11089 段 / 1663 万字（灵境4.29M+大奉3.93M+玩家凶猛3.16M+恐怖屋3.18M+还剩三个月命0.17M×12倍）
### 关键参数：stage pt / LR 1e-5（约为原预训练 LR 的 10%）/ lora_target all / packing true
### 预估 635 步 = 1 epoch

### v20：把 AI 指纹词点名写进指令（针对第一优先级需求）
### 背景（需求澄清）：目标不是把大纲要点写全，而是
###   「800~1000 字大纲 -> 3000~4000 字，越像人写、越像卖报越好，最主要不能有 AI 味和 AI 语言逻辑」。
### 实测定位：训练语料自身的 AI 指纹词密度 1.1/千字（比卖报原著 1.5 还干净），
###   但模型产出 2.1~3.3 —— 指纹词来自基座 Qwen 的固有习惯，**不是学来的**，
###   所以过滤数据治不了它，只能在指令里点名禁止。
### 词表出处：今日头条《小说去高频词》（取材 AIGC 检测机构公开报告+高校词频数据）。
### 同一机制已被验证有效：【克制动笔】点名「心里一酸/仿佛/小心翼翼地」后，
###   直陈情绪 1.99 -> 0.0、比喻词 3.98 -> 1.96。
### 唯一变量 = 指令（过滤器口径与 v18 一致，用 --noise-two 固定住）

### v18：v16 的数据 + 去掉分段（单段长训练）
### 依据 v17 的单变量归因实验：
###   v15（单段，偏离2项） vs v17（分段，偏离9项）—— 数据相同，只改训练方式
###   → **分段训练是风格退化的元凶**（每段重启优化器与 LR 曲线，loss 被压到 0.68）
###   而 v16（分段+改数据，偏离7项）好于 v17（分段+原数据，9项）
###   → **v16 的数据改动本身有效**，正向作用抵消了部分分段伤害
### 所以本版：保留 v16 数据，去掉分段，单段跑满。
### 另：已把电源设为「睡眠/休眠/显示器 全部从不」，消除夜间低功耗降速。

### v16：修正 v15 的两条代价
### v15 的战果要保住：风格偏离项 6->2、直陈情绪 1.99->0.0、比喻词 3.98->1.96、异常符号 0/16
### 但 v15 付出两个代价，本版精确修正：
###   1) 对白占比矫枉过正（38.6% -> 61.1%，作者本人 41.1%）
###   2) 声线退步：C1 有对白角色 2 -> 1 个（删掉了多人对白的感情戏）
###   3) 要点覆盖 2.7/6（疑似因为 --emo-drop 连大纲样本一起削了 396->348）
### 修正内容：
###   - 情绪浓度过滤**只作用于续写样本**，大纲与多要点不碰
###   - 剔除时**跳过多人对白样本**（>=2 个具名说话人的不剔）：本次保护了 343 条
### 数据：2522 条（续写1990 / 大纲396 / 多要点136），中位浓度 1.37->0.79，卖报占比 79%

### v15：针对已确诊的「AI 腔」做三处修正
### 依据 v14b 的同场景对比实测：同一场戏，卖报本人「直陈情绪 0.0 / 比喻词 0.0 每千字」，
### 模型「1.99 / 3.98」。诊断＝模型在往卖报的稿子里加卖报自己不加的东西。
### 三处改动：
###   1) 数据侧对抗：剔除情绪浓度最高的 15% 样本（中位浓度 1.37 -> 0.72 /千字）
###   2) SYS_RULES 新增【克制动笔】：点名具体词形（心里一酸/感到/意识到/小心翼翼地/仿佛…）
###      —— 原来只有抽象的「禁直陈」，模型照犯，所以改成点名
###   3) 禁符号条款去掉符号列举（不再写 ┻ ╯ ♂ ♀ °，避免负向提示）
### 配置沿用 v13 的 rank 8 / adamw_torch —— rank 加倍会在 8GB 卡上触发整机崩溃（v14 事故）
### 数据：2411 条（续写1927 / 大纲348 / 多要点136），卖报占比 79%

### v13：模板对齐 + 人物声线 + 通用回放（三项修正）
### 依据用户指示：① 他的大纲只能作检测样本，训练只用那五本网文（越界检查已改硬拦截）
###               ② 他要的是「1000字大纲 -> 3000~4000字带卖报腔、且每人语气可辨」
### 相对 v12 的四处改动：
###   1) 训练样本模板与推理端逐字对齐（原来训练写「剧情大纲：」+「第15章的这一幕（定位 SEG-…）」，
###      推理写「章级大纲：」+「《第二卷》第3章（本次只写这一幕的 1/1 段）」，同槽不同标签）
###   2) 硬约束段注入【人物声线】（只列本段真出场的人物）—— 让模型学会给了声线就要落实
###   3) 打开通用回放（52 条）—— 此前四版因路径写错一直是关的
###   4) 数据 2632 -> 2684 条

### v12：完整消化五本 + 卖报占比高 + 训练量做上去
### 决策记录：自有故事暂不进入训练（当时仍在修改），只作检测样本，
###   本版以完整消化那五本网文为主
### 三处调整：
###   1) 五本都回到有意义的量（v11c 把玩家凶猛压到35、恐怖屋25，那不算消化）
###   2) 卖报占比仍高：79.1%（灵境1532 + 大奉550 = 2082 / 2632）
###   3) 训练量做上去：1392 -> 2632 条（v11c 实测训练量翻倍时覆盖率 +46%）
### 越界守卫：preflight_data.py 已加检查项，确认训练集不含用户世界观内容

### v11c：提高卖报占比 + 压缩数据量（让一轮能在几小时内跑完）
### 用户诉求：「把卖报的书占比调高，让模型会说人话」——是提份额，不是砍别的书。
### 硬约束：GPU 降频后步时 124 秒，400 步要 10 小时，所以必须压缩数据量。
### 配方：灵境450 / 大奉230 / 玩家凶猛35 / 恐怖屋25 / 还剩三个月命120 = 续写860
###       + 大纲396 + 多要点136 = 共 1392 条（169 步）
### 卖报占比 87.1%（v10 是 75.0%）；多要点从 dup2 改回 dup1（未经验证，先不重复）

### v10：把被证实有效的方向加量（多要点样本 85 -> 272）
### 依据：v8 实测把要点覆盖率从 2.2/6 提到 3.8/6（+73%），说明数据侧方向是对的。
### v10 相对 v8 只改四处，保持可比性：
###   1) 多要点样本 85 -> 272 条（新增「三段」样本，占比重 2.7% -> 8.3%）
###   2) 每个要点限 450 字 —— 绝不能靠 cutoff 截断，被砍掉的正好是最后一个要点
###   3) 大纲样本超长部分按句末收口到 1500 字
###   4) cutoff_len 2432 -> 2048（治显存/TDR 的根因）
### 续写配额不动，这样 v8 -> v10 的差异只来自「多要点样本的量和形态」。

### v8：v6 配方 + 多要点样本 + 补回四条关键约束 + 破折号清零
### 定位：在 v3（灵境+大奉）基础上扩到五书，取长补短；卖报文风仍为锚。
### 数据：dataset_multi.jsonl = 2854 续写式（灵境900/大奉700/玩家凶猛700/恐怖屋450/还剩三个月104）+ 396 大纲式（已归一化）
### 硬件：RTX 4060 Laptop 8GB → QLoRA 4bit + batch1 + 梯度检查点
### 训练期纪律：不得并行运行任何加载模型的程序（8GB 显存会被挤爆并拖慢训练）
### 用法：PYTHONPATH= HF_DATASETS_CACHE=... llamafactory-cli train configs/cpt/cpt-v2.yaml

model_name_or_path: <项目目录>\Models\models\Qwen--Qwen2.5-7B-Instruct
trust_remote_code: true

stage: pt
do_train: true
finetuning_type: lora

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1
lora_target: all
use_rslora: false

quantization_bit: 4
quantization_method: bnb
double_quantization: false   # 2026-09-16 根因修复：True 会在本环境触发 CUDA 越界

dataset: cpt_corpus_v2
dataset_dir: <项目目录>\LLaMA-Factory\data
template: qwen
cutoff_len: 1792           # 从 2048 降下来抵消 double_quant 关闭带来的 +0.30GB 显存
                           # 已把所有超长样本按句末收口，2048 下仅 1 条被截（预检实测）。
overwrite_cache: false
preprocessing_num_workers: 1
packing: true

output_dir: <项目目录>/LLaMA-Factory/outputs/cpt_v2
logging_steps: 10
save_steps: 25            # 每段损失窗口更小（分段训练用）
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
# ⚠️ 2026-09-16 补上：LLaMA-Factory 每次启动都在建议这一项，
#    管的是「量化训练的数值稳定性」—— 而我们的故障正是数值崩坏（loss 暴涨→NaN）。
#    upcast_layernorm 让 LayerNorm 用 fp32 计算，显存代价极小（几 MB）。
upcast_layernorm: true
fp16: false
gradient_checkpointing: true
max_grad_norm: 1.0
optim: adamw_torch   # 2026-09-17 换回：8bit 分页版在 GPU 余量薄时会抖动，慢一倍且不带来稳定性

val_size: 0.03
per_device_eval_batch_size: 1
eval_strategy: "no"
eval_steps: 50
save_strategy: steps
load_best_model_at_end: false
metric_for_best_model: loss
greater_is_better: false

### 若 1 轮明显欠拟合（风格没吃进去），再从该适配器续训 1 轮，而不是重开。
### 推理参数（v1/v2/v3 统一）：temp 0.6~0.7 / top_p 0.9 / top_k 40 / repetition_penalty 1.1
###   no_repeat_ngram 4 / stop_strings=["<|im_end|>","<|im_start|>","\nuser"] / max_new_tokens 1400

do_eval: false


# 分段训练：第 1 段上限 300 步（约 4.2 小时 @50秒/步）
# 每段重启进程 → 显存分配器重置 → 速度回到初始值，所以步时是可预测的 ✓
max_steps: 1003   # 完整 epoch：2026-09-17 继续 CPT（425 起）
